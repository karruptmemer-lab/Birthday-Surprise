<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Surprise 🎂</title>

    <link rel="stylesheet" href="cake.css">
</head>

<body>

<canvas id="fireworks"></canvas>

<div id="lights"></div>

<div id="balloons"></div>

<div id="confetti"></div>

<div id="fairyLights"></div>

<div class="container">

    <h1>🎉 Happy Birthday 🎉</h1>

    <p class="wish">
        Make a wish before blowing the candles... ✨
    </p>

    <div class="cake">

        <div class="candles">

            <div class="candle">
                <span class="flame"></span>
            </div>

            <div class="candle">
                <span class="flame"></span>
            </div>

            <div class="candle">
                <span class="flame"></span>
            </div>

        </div>

        <div class="layer top"></div>
        <div class="layer middle"></div>
        <div class="layer bottom"></div>

    </div>

    <button id="blowBtn">
        🕯️ Blow the Candles
    </button>

</div>

<script src="cake.js"></script>

</body>
</html>
