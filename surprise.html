<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<link rel="stylesheet" href="surprise.css">

</head>

<body>

<div id="bokeh"></div>

<div id="fairyLights"></div>

<audio id="bgMusic" autoplay loop>
    <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<div id="hearts"></div>
<div id="stars"></div>

<div class="background"></div>

<div class="hero">

    <div class="overlay"></div>
    <div id="stars"></div>
    <div id="particles"></div>

    <div class="hero-content">

    <div class="date">08 • 08 • 26</div>

    <h1>Happy Birthday 🎂🎈</h1>

    <p>
        Wishing you endless happiness, beautiful memories,
        and a year full of love and smiles. 💛
    </p>

    <button id="startBtn">
        💛 Read Your Letter
    </button>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
